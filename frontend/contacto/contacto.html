<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tienda — Gestión de Productos</title>

  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="../index.html">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="contenedor" id="inicio">
    <div class="encabezado-principal">
      <h1>Sistema de Gestión de Contactos</h1>
    </div>

    <div class="panel-tienda">
      <!-- SECCIÓN 1: Formulario de Registro  Contacto-->
      <section class="tarjeta" id="registro">
        <h2 id="tituloFormulario">Registrar Mensaje</h2>

        <form id="formulario-Mensajes">
          <!-- Campo oculto para almacenar el ID en caso de edición -->
          <input type="hidden" id="mensajeId" value="" />

          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Introduzca su nombre" required />
          </div>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Introduzca su direccion de correo electronico" required />
          </div>

          <div class="campo">
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" placeholder="Introduzca el asunto" required />
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <input type="text" id="mensaje" placeholder="Introduzca el mensaje" required />
          </div>

          <div class="acciones-form">
            <button type="submit" id="btnGuardar" class="btn btn-guardar">Guardar Mensaje</button>
            <button type="button" id="btnCancelar" class="btn btn-cancelar" style="display: none;">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- SECCIÓN 2: Lista de Productos -->
      <section class="tarjeta" id="productos">
        <h2>Lista de Mensajes</h2>
        <div id="listaMensajes" class="lista-mensajes">
          <!-- Los productos se cargan desde app.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
