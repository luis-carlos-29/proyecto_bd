<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Gestion De Productos</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    
    <!-- NavBar -->

<header class="navbar">
    <div class="contenedor nav-contenido">
        <a href="index.html" class="logo">Mi <strong>Tienda</strong></a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="#productos">Productos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </div>
</header>
  <!-- Contenido -->
   <main class="contenedor">
        <div class="encabezado-principal">
            <h1>Sistema de Gestion De Productos</h1>
            <p>Panel conectado a Node.js, Express y MySQL</p>
        </div>

        <div class="panel-tienda">
            <section class="tarjeta">
                <h2 id="tituloFormulario">Registrar Producto</h2>
                <form id="formularioProducto">
                    <input type="hidden" id="productoId" value=""/>
                        <div class="campo">
                            <label for="nombre">Nombre del Producto: </label>
                            <input type="text" id="nombre" placeholder="Ej. Camiseta" required/>
                        </div>

                        <div class="campo">
                            <label for="precio">Precio ($)</label>
                            <input type="number" id="precio" step="0.01" placeholder="EJ. 25000" required/>
                        </div>
                        
                        <div class="campo">
                            <label for="stock">Stock (Cantidad)</label>
                            <input type="number" id="stock" placeholder="EJ. 10" required/>
                        </div>

                        <div class="acciones-form">
                            <button type="submit" id="btnGuardar" class="btn btn-guardar">Guardar Producto</button>
                            <button type="button" id="btnCancelar" class="btn btn-cancelar" style="display: none;">Cancelar</button>
                        </div>
                </form>
            </section>

            
                <!-- SECCION 2: Lista de Productos-->
             <div>
                <section class="tarjeta" id="productos">
                        <h2>Lista de Productos</h2>
                        <div id="listaProductos" class="lista-productos">
                            <!-- Los productos se cargan desde app.js-->
                        </div>
                </section>
                </div>
        </div>
   </main>

<!-- FOOTER-->
 <footer class="footer">
    <divc lass="contenedor footer-contenido">
        <p> &copy 2026 Mi Tienda - Proyecto Formativo con Node.js, Express y MySQL</p>
    </div>
 </footer>


 <script src="app.js"> </script>


</body>
</html>
